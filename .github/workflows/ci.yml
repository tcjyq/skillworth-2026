name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install public dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Build deterministic Demo fixture
        run: python -m app.cli build-demo-dataset --output-root data/modes/demo/current
      - name: Run public-safe test suite
        run: python -m pytest

  web:
    name: Web checks and Demo E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      SKILLWORTH_PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Create project Python environment
        working-directory: .
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e ".[dev]"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test -- --run
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: PLAYWRIGHT_BROWSERS_PATH=../../.tmp/playwright-browsers npx playwright install --with-deps chromium
      - name: Run deterministic Demo E2E
        run: npm run test:e2e
