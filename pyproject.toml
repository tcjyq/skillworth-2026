[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "skillworth-data-pipeline"
version = "0.1.0"
description = "SkillWorth Bronze to Silver labor-market ETL pipeline"
requires-python = ">=3.11"
dependencies = [
  "polars>=1.32.3,<2",
  "pyarrow>=19,<24",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0.2,<7",
  "rapidfuzz>=3.14,<4",
  "duckdb>=1.4,<2",
  "numpy>=2.0,<3",
  "statsmodels>=0.14.5,<0.15",
  "networkx>=3.4,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "httpx>=0.28,<1",
  "streamlit>=1.50,<2",
]

[tool.setuptools.packages.find]
where = ["packages/data-pipeline/src", "packages/analytics/src", "apps/api/src"]

[tool.setuptools.package-data]
skillworth_analytics = ["sql/*.sql"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["packages/data-pipeline/src", "packages/analytics/src", "apps/api/src"]
testpaths = ["tests"]
