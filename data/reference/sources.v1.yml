    dataset_version: "revision-e12a94a46a334188082d329a175e11bc580f6ba2"
    download_url: https://huggingface.co/datasets/yash2111/most-in-demand-skills-2026/resolve/e12a94a46a334188082d329a175e11bc580f6ba2/skills-2026-overall.csv
    license_name: CC BY 4.0
    license_url: https://creativecommons.org/licenses/by/4.0/
    data_usage_status: reviewed
    notes: >-
      External benchmark only. The published aggregate summarizes 360,336 job postings collected from
      2025-12-27 through 2026-06-16 and has DOI 10.5281/zenodo.21204423. It must never enter SkillWorth
      job tables, pooled/platform-balanced demand denominators, salary models, or source-diversity counts.
    schema_mapping_version: "1.0.0"
    column_mapping: {}

  - source_id: ncss_public_jobs
    source_name: 国家大学生就业服务平台（NCSS）公开岗位
    source_type: official_employment_platform
    analysis_role: core_market_candidate
    acquisition_method: authorized_manual_export
    enabled: false
    mode: manual_import
    connector: ncss_public_export
    terms_url: https://job.ncss.cn/student/connectUser.html
    data_usage_status: permission_required
    notes: >-
      仅定义本地 CSV/JSONL 映射，不包含网络采集器。NCSS 用户协议限制信息用途并禁止未经许可的下载、复制和再使用；
      在取得并记录适用于 SkillWorth 分析及展示场景的书面许可前，不得导入、运行 Preflight 或升级为 core_market。
      上游 NIHILITY-cool/Spark-employment-platform 的 MIT License 只覆盖其代码，不覆盖 NCSS 岗位数据。
    schema_mapping_version: "1.0.0"
    column_mapping:
      source_job_id: [source_job_id]
      source_url: [source_url]
      company_name: [company_name]
      job_title: [job_name]
      city: [city]
      education: [education_text]
      experience: [experience_text]
      salary: [salary_text]
      published_at: [publish_time]
      job_description: [job_description]

