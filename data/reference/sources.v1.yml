version: "1.0.0"
freshness_days: 30

sources:
  - source_id: freehire
    source_name: Freehire China Technical Jobs — August 2026
    source_type: public_api_catalogue
    analysis_role: supplementary_market
    acquisition_method: documented_unauthenticated_public_read_api_snapshot
    enabled: true
    mode: public_api
    connector: freehire_public_api
    terms_url: https://freehire.me/docs/api
    dataset_url: https://freehire.me/jobs
    dataset_version: "freehire_china_tech_2026_08"
    license_name: "MIT applies to Freehire software only; third-party job text excluded"
    license_url: https://github.com/strelov1/freehire/blob/d7ab8697635528b47cea719a590eac485e1dfa2c/LICENSE
    data_usage_status: no_explicit_block_found
    notes: >-
      Public documented read API snapshot for aggregate analysis. No login, cookie, session,
      private endpoint or access-control bypass is used. Freehire's MIT software license does
      not license third-party job text; SkillWorth does not redistribute the bulk JD corpus.
      This source remains supplementary_market and does not represent the complete China market.
    schema_mapping_version: "1.0.0"
    column_mapping:
      source_job_id: [source_job_id]
      source_url: [source_url]
      company_name: [company_name]
      job_title: [job_title]
      city: [city]
      education: [education]
      experience: [experience]
      salary: [salary]
      published_at: [published_at]
      job_description: [job_description]

  - source_id: nextgig_global_jobs_2026_06
