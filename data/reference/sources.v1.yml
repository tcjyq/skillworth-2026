    acquisition_method: huggingface_revision_pinned_public_download
    enabled: true
    mode: public_dataset
    connector: nextgig_june_2026
    terms_url: https://creativecommons.org/licenses/by/4.0/
    dataset_url: https://huggingface.co/datasets/NextGig-Rocks/global-job-postings-multi-ats
    dataset_version: "revision-fc9787e07b2a9b5f11a470c503c36e854abd6378-preflight-seed-202606-n5000"
    download_url: https://huggingface.co/datasets/NextGig-Rocks/global-job-postings-multi-ats/resolve/fc9787e07b2a9b5f11a470c503c36e854abd6378/nextgig_jobs_2026-06.parquet
    license_name: CC BY 4.0
    license_url: https://creativecommons.org/licenses/by/4.0/
    expected_sha256: 20d40c5e721e8459d156c7f9ae1b5b53829dbff154e5e6d89b53e13f8d3226d5
    data_usage_status: reviewed
    notes: >-
      Attribution: NextGig-Rocks/global-job-postings-multi-ats by NextGig, licensed CC BY 4.0.
      当前 hash 固定的是从上游 revision 以 seed=202606 无放回抽样并按原始 row index 排序得到的 5,000 行 Preflight Parquet，
      不是全量文件 hash；完整派生链记录在 data/reference/nextgig_source_metadata.v1.json。
      数据覆盖全球而非中国专属市场；country/city 为上游派生字段，job_description 为上游 LLM 摘要，
      日期覆盖稀疏且缺少原始 application URL/source job id。通过 Gate 前不得升级为 core_market。
    schema_mapping_version: "1.0.0"
    column_mapping:
      source_job_id: [source_job_id]
      source_url: [source_url]
      company_name: [company_name]
      job_title: [job_title, title]
      city: [city]
      education: [education, education_level]
      experience: [experience, experience_level]
      salary: [salary]
      published_at: [published_at, date_posted]
      job_description: [job_description]

